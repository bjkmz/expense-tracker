<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Expense Tracker{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  {# plotly.js loaded ONCE here. HTMX partials must use include_plotlyjs=False. #}
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <script>
    // Attach Django CSRF token to all HTMX mutating requests (POST/PUT/PATCH/DELETE)
    document.addEventListener('htmx:configRequest', function (e) {
      var m = document.cookie.match(/csrftoken=([^;]+)/);
      if (m) { e.detail.headers['X-CSRFToken'] = m[1]; }
    });
    // Calendar Day/Month tabs: highlight active tab within its own button group.
    function setCalTab(btn) {
      var wrap = btn.parentElement;
      if (!wrap) return;
      wrap.querySelectorAll('[data-cal-tab]').forEach(function (b) { b.classList.remove('cal-tab-active'); });
      btn.classList.add('cal-tab-active');
    }
    // Home calendar aside: full hide + unified folder tab.
    // Aside always keeps `hidden` (mobile); `md:flex` controls desktop visibility.
    // Toggle sits at logo-row height: inside the 25vw edge when open (mirrored tab),
    // docked at left-0 when closed. Only position, rounding side, chevron, and title change.
    function toggleHomeCal() {
      var side = document.getElementById('sidenav');
      var btn = document.getElementById('cal-toggle');
      if (!side) return;
      var open = side.classList.contains('md:flex');
      if (open) {
        side.classList.remove('md:flex');
        side.classList.add('hidden');
      } else {
        side.classList.add('md:flex');
        side.classList.add('hidden');
      }
      if (btn) {
        var nowOpen = !open;
        btn.classList.remove(nowOpen ? 'left-0' : 'right-[75vw]');
        btn.classList.add(nowOpen ? 'right-[75vw]' : 'left-0');
        btn.classList.remove(nowOpen ? 'rounded-r-full' : 'rounded-l-full');
        btn.classList.add(nowOpen ? 'rounded-l-full' : 'rounded-r-full');
        btn.classList.remove(nowOpen ? 'border-l-0' : 'border-r-0');
        btn.classList.add(nowOpen ? 'border-r-0' : 'border-l-0');
        var mark = btn.querySelector('svg');
        if (mark) mark.style.transform = nowOpen ? '' : 'rotate(180deg)';
        btn.title = nowOpen ? 'Hide calendar' : 'Show calendar';
      }
    }
    // Home Add Record modal: on server-confirmed save, close + toast + refresh calendars.
    // The server sends HX-Trigger: record-created only on success; errors stay in #add-error.
    document.addEventListener('htmx:afterRequest', function (e) {
      if (!e.target || e.target.id !== 'add-form') return;
      var trig = e.detail.xhr ? e.detail.xhr.getResponseHeader('HX-Trigger') : null;
      if (trig && trig.indexOf('record-created') !== -1) {
        var modal = document.getElementById('add-modal');
        var form = document.getElementById('add-form');
        if (form) form.reset();
        var err = document.getElementById('add-error');
        if (err) { err.innerHTML = ''; err.className = 'mb-2 px-3 py-2 rounded text-sm'; }
        if (modal && modal.open) modal.close();
        var toast = document.getElementById('home-toast');
        if (toast) {
          toast.textContent = 'Record saved for today.';
          toast.classList.remove('hidden');
          setTimeout(function () { toast.classList.add('hidden'); }, 3000);
        }
        if (window.htmx) {
          document.querySelectorAll('[data-cal]').forEach(function (el) { htmx.trigger(el, 'refresh'); });
        }
      }
    });
  </script>
  <style>
    :root { --banner: #FF9A8B; --teal: #5ED6DC; }
    .banner { color: var(--banner); letter-spacing: .02em; text-shadow: 0 2px 12px rgba(255,255,255,0.9), 0 0 2px #fff; }
    .banner-bg { background-image: url('/static/banner-bg.jpg'); background-size: cover; background-position: center; }
    .cal-tab-active { border-color: #d4d4d4; color: #e5e5e5; background: rgba(255,255,255,0.08); }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="bg-neutral-100 text-neutral-900" hx-boost="false">
  {% block content %}{% endblock %}
</body>
</html>
