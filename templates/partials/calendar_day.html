{# Day heatmap grid: 7-col sequential like sketches. Each cell: day no. + income + expense. #}
<div class="flex items-center justify-between px-2 py-2 border-b border-neutral-800">
  <button class="px-2 text-neutral-400" hx-get="{% url 'calendar-day' %}?ym={{ prev_ym }}" hx-target="closest [data-cal]" hx-swap="innerHTML">‹</button>
  <span class="flex items-center gap-1.5 font-semibold">
    <label class="relative inline-flex cursor-pointer text-neutral-400 hover:text-neutral-200" title="Jump to date">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <input type="date" value="{{ ym }}-01" aria-label="Jump to date" class="absolute inset-0 opacity-0 cursor-pointer" onchange="jumpCalDay(this)" />
    </label>
    {{ ym_label }}
  </span>
  <button class="px-2 text-neutral-400" hx-get="{% url 'calendar-day' %}?ym={{ next_ym }}" hx-target="closest [data-cal]" hx-swap="innerHTML">›</button>
</div>
<div class="grid grid-cols-7 gap-px bg-black/60 text-center text-[9px] text-neutral-400">
  <div class="bg-neutral-800 py-1">Su</div><div class="bg-neutral-800 py-1">Mo</div><div class="bg-neutral-800 py-1">Tu</div><div class="bg-neutral-800 py-1">We</div><div class="bg-neutral-800 py-1">Th</div><div class="bg-neutral-800 py-1">Fr</div><div class="bg-neutral-800 py-1">Sa</div>
</div>
<div class="grid grid-cols-7 gap-px bg-black/60">
  {% for c in cells %}
    {% if c is None %}
      <div class="bg-neutral-700 min-h-[52px]"></div>
    {% else %}
      <a href="{% url 'day-detail' c.iso %}" title="I {{ c.income|default:'–' }} / E {{ c.expense|default:'–' }}"
         class="flex flex-col min-w-0 overflow-hidden min-h-[52px] p-1 text-left
          {% if c.flag == 'today' %}bg-green-300 text-neutral-900
          {% elif c.flag == 'hot' %}bg-red-300 text-neutral-900
          {% elif c.flag == 'cold' %}bg-blue-200 text-neutral-900
          {% else %}bg-neutral-600 text-neutral-100{% endif %}">
        <div class="text-right text-sm font-semibold leading-4">{{ c.day }}</div>
        <div class="mt-auto">
          <div class="truncate tabular-nums text-[9px] leading-3 {% if c.flag %}text-green-800{% else %}text-green-400{% endif %}">I {{ c.income_s }}</div>
          <div class="truncate tabular-nums text-[9px] leading-3 {% if c.flag %}text-red-800{% else %}text-red-400{% endif %}">E {{ c.expense_s }}</div>
        </div>
      </a>
    {% endif %}
  {% endfor %}
</div>
