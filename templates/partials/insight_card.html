{# One insight card. Expects: label, value, bg; optional sub, right, when, dense. #}
<div class="grid grid-cols-[1fr_auto_1fr] {% if dense %}items-center px-4 py-3{% else %}items-baseline px-4 py-4{% endif %} {{ bg }} border-b border-slate-200">
  <span class="text-slate-500">{{ label }}</span>
  <span class="{% if dense %}font-medium text-xs text-center flex flex-col items-center leading-tight text-slate-900{% else %}font-medium text-center text-slate-900{% endif %}">{% if value %}{{ value }}{% else %}–{% endif %}{% if dense and sub %}<span class="text-[10px] text-slate-500 font-normal">{{ sub }}</span>{% endif %}</span>
  <span class="text-slate-500 text-right">{% if right %}{{ right }} records{% elif when %}{{ when|date:ins.card_date_format }}{% else %}–{% endif %}</span>
</div>
