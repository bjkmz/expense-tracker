{# Shared calendar panel (home + data views). Params: mode='desktop'|'side', collapsible=True/False. #}
<div class="flex items-center justify-between p-3 bg-slate-800">
  <a href="/" class="flex items-center gap-2">
    <img src="/static/logo.png" alt="logo" class="h-8 w-auto" onerror="this.style.display='none'" />
  </a>
</div>
<div {% if collapsible %}id="aside-body" {% endif %}class="flex flex-col flex-1 bg-slate-900">
  <div class="h-3 bg-gradient-to-b from-slate-800 to-slate-900" aria-hidden="true"></div>
  <div class="flex gap-2 px-3">
    {% if mode == "side" %}
    <button data-cal-tab class="flex-1 border border-slate-600 rounded py-1 text-sm{% if cal_tab != 'month' %} cal-tab-active{% endif %}" onclick="setCalTab(this)" hx-get="{% url 'calendar-day' %}?ym={{ default_ym }}" hx-target="[data-cal-side]" hx-swap="innerHTML">DAY</button>
    <button data-cal-tab class="flex-1 border border-slate-600 rounded py-1 text-sm{% if cal_tab == 'month' %} cal-tab-active{% endif %}" onclick="setCalTab(this)" hx-get="{% url 'calendar-month' %}?y={{ default_y }}" hx-target="[data-cal-side]" hx-swap="innerHTML">MONTH</button>
    {% else %}
    <button data-cal-tab class="flex-1 border border-slate-600 rounded py-1 text-sm cal-tab-active" onclick="setCalTab(this)" hx-get="{% url 'calendar-day' %}?ym={{ default_ym }}" hx-target="[data-cal-desktop]" hx-swap="innerHTML">DAY</button>
    <button data-cal-tab class="flex-1 border border-slate-600 rounded py-1 text-sm" onclick="setCalTab(this)" hx-get="{% url 'calendar-month' %}?y={{ default_y }}" hx-target="[data-cal-desktop]" hx-swap="innerHTML">MONTH</button>
    {% endif %}
  </div>
  {% if mode == "side" %}
  <div data-cal data-cal-side class="m-3 border border-slate-700 bg-slate-800 rounded min-h-[240px]"
       hx-get="{% if cal_tab == 'month' %}{% url 'calendar-month' %}?y={{ default_y }}{% else %}{% url 'calendar-day' %}?ym={{ default_ym }}{% endif %}" hx-trigger="load, refresh" hx-swap="innerHTML">
  {% else %}
  <div data-cal data-cal-desktop id="calendar" class="m-3 border border-slate-700 bg-slate-800 rounded min-h-[240px]"
       hx-get="{% url 'calendar-day' %}?ym={{ default_ym }}" hx-trigger="load, refresh" hx-swap="innerHTML">
  {% endif %}
    <div class="p-4 text-sm text-slate-400">Loading calendar…</div>
  </div>
</div>
