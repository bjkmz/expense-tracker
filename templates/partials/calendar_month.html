{# Month heatmap grid: 2-col like 2.png. Each cell: MON + income + expense. #}
<div class="flex items-center justify-between px-2 py-2 border-b border-neutral-800">
  <button class="px-2 text-neutral-400" hx-get="{% url 'calendar-month' %}?y={{ prev_y }}" hx-target="closest [data-cal]" hx-swap="innerHTML">‹</button>
  <span class="flex items-center gap-1.5 font-semibold">
    <label class="relative inline-flex cursor-pointer text-neutral-400 hover:text-neutral-200" title="Jump to month">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <input type="month" value="{{ y }}-01" aria-label="Jump to month" class="absolute inset-0 opacity-0 cursor-pointer" onchange="jumpCalMonth(this)" />
    </label>
    {{ y }}
  </span>
  <button class="px-2 text-neutral-400" hx-get="{% url 'calendar-month' %}?y={{ next_y }}" hx-target="closest [data-cal]" hx-swap="innerHTML">›</button>
</div>
<div class="grid grid-cols-2 gap-px bg-black/60">
  {% for c in cells %}
    <a href="{% url 'month-detail' c.ym %}" title="I {{ c.income|default:'–' }} / E {{ c.expense|default:'–' }}"
       class="flex items-stretch justify-between gap-2 px-2 py-2 min-w-0 overflow-hidden
        {% if c.flag == 'today' %}bg-green-300 text-neutral-900
        {% elif c.flag == 'hot' %}bg-red-300 text-neutral-900
        {% elif c.flag == 'cold' %}bg-blue-200 text-neutral-900
         {% else %}bg-neutral-600 text-neutral-100{% endif %}">
      <span class="flex items-center text-sm">{{ c.name }}</span>
      <span class="flex flex-col justify-center text-right min-w-0">
        <span class="truncate tabular-nums text-[9px] leading-3 {% if c.flag %}text-green-800{% else %}text-green-400{% endif %}">I {{ c.income_s }}</span>
        <span class="truncate tabular-nums text-[9px] leading-3 {% if c.flag %}text-red-800{% else %}text-red-400{% endif %}">E {{ c.expense_s }}</span>
      </span>
    </a>
  {% endfor %}
</div>
