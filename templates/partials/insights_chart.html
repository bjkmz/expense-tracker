{# Chart box: toggle button + figure (panel include + endpoint outerHTML swap). #}
{# Expects: ins_scope, ins_period, chart_flipped, chart_html. #}
<div id="insights-chart-box" class="relative flex-1 min-h-0 p-5">
  <button class="absolute right-5 top-5 z-10 border border-slate-300 rounded px-2 text-slate-500 hover:border-brand hover:text-brand" title="Toggle Line/Pie"
          hx-get="{% url 'insights-chart' %}?scope={{ ins_scope }}&period={{ ins_period }}&type={{ chart_flipped }}"
          hx-target="#insights-chart-box" hx-swap="outerHTML">⇄ {{ chart_flipped }}</button>
  <div id="insights-chart" class="h-full min-w-0">{{ chart_html|safe }}</div>
</div>
